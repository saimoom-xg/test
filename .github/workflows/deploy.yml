name: Deploy to cPanel

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Build and Deploy
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout code
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Setup PHP
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, bcmath, pdo, pdo_mysql
          tools: composer

      # 3. Install Laravel dependencies
      - name: Install Composer dependencies
        run: |
          composer install \
            --no-interaction \
            --prefer-dist \
            --optimize-autoloader

      # 4. Verify Laravel dependencies
      - name: Verify Laravel vendor
        run: |
          if [ ! -f "vendor/autoload.php" ]; then
            echo "ERROR: vendor/autoload.php was not created."
            exit 1
          fi

          echo "vendor/autoload.php exists."

      # 5. Verify Artisan
      - name: Verify Laravel Artisan
        run: php artisan --version

      # 6. Setup Node.js
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # 7. Install JavaScript dependencies
      - name: Install npm dependencies
        run: npm ci

      # 8. Build frontend
      - name: Build frontend
        run: npm run build

      # 9. Deploy to cPanel
      - name: Deploy files to cPanel
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          port: 21
          server-dir: choco/
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            **/.env
            **/storage/logs/**